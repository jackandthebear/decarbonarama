[build]
  publish = "."

# Internal agent knowledge/spec files live in /agent for the function to bundle,
# but must not be publicly served. Block them (build-time bundling is unaffected).
[[redirects]]
  from = "/agent/*"
  to = "/"
  status = 404
  force = true

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.images]
  compress = false

# --- Canonical URL enforcement -------------------------------------------------
# Netlify also serves an extensionless twin of every page (/articles/foo as well
# as /articles/foo.html). Google picked the extensionless form as canonical and
# then reported the .html URLs from sitemap.xml as duplicates, which left several
# articles unindexed. These 301s collapse each page onto the single .html URL used
# in sitemap.xml and in every <link rel="canonical">.
#
# force = true is required: without it Netlify serves the .html file for the
# extensionless path before redirect rules are evaluated, so the rule never fires.
# Every "from" below is an explicit extensionless path (never a :placeholder), so
# no rule can match a .html request and no redirect loop is possible.
# Regenerate from the file list when adding a page.

[[redirects]]
  from = "/articles/air-source-heat-pumps"
  to = "/articles/air-source-heat-pumps.html"
  status = 301
  force = true

[[redirects]]
